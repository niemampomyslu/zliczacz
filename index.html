<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14251f"><title>Licznik ogrodzenia</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#192b24;background:#f3f6f3}*{box-sizing:border-box}body{margin:0}header{background:#14251f;color:white;padding:22px 18px}h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:#c5d6cb;font-size:13px}.wrap{max-width:780px;margin:auto;padding:16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}.tab{padding:14px 5px;border:1px solid #ccd8cf;background:white;border-radius:12px;font-weight:700;color:#244337}.tab.active{background:#246b4a;color:white;border-color:#246b4a}.summary{background:#e2efe6;padding:13px;border-radius:12px;margin-bottom:14px;font-size:14px}.grid{display:grid;gap:11px}.item{display:flex;align-items:center;justify-content:space-between;background:white;border:1px solid #e0e8e1;border-radius:16px;padding:15px 12px;gap:8px}.name{font-size:16px;font-weight:700}.sub{font-size:12px;color:#68776d;margin-top:4px}.controls{display:flex;align-items:center;gap:8px}.count{min-width:34px;text-align:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.btn{border:0;border-radius:12px;min-width:48px;min-height:52px;font-size:26px;font-weight:700;touch-action:manipulation}.plus{background:#217b50;color:white}.minus{background:#e8eee9;color:#28503a}.panel{background:white;border-radius:14px;padding:15px;margin-top:16px}h2{font-size:17px;margin:0 0 12px}.totalrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #edf0ed}.totalrow:last-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.action{padding:12px;border:1px solid #cad8cd;border-radius:10px;background:white;font-weight:650;color:#1c4832}.danger{color:#a62c2c}.muted{font-size:12px;color:#617266;margin-top:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#183f2d;color:white;padding:12px 18px;border-radius:10px;display:none}@media(max-width:370px){.item{padding:12px 8px}.btn{min-width:42px}.controls{gap:4px}.name{font-size:14px}}
</style></head><body><header><div style="max-width:780px;margin:auto"><h1>🧱 Licznik ogrodzenia</h1><p>Trzy strony • szybkie liczenie elementów • zapis automatyczny</p></div></header>
<main class="wrap"><nav class="tabs" id="tabs" aria-label="Wybierz stronę ogrodzenia"></nav><div class="summary" id="summary"></div><section class="grid" id="items"></section>
<section class="panel"><h2>Łącznie — wszystkie strony</h2><div id="totals"></div></section>
<div class="actions"><button class="action" id="undo">↶ Cofnij</button><button class="action" id="export">↓ Eksport CSV</button><button class="action" id="backup">↓ Kopia JSON</button><button class="action" id="importBtn">↑ Wczytaj JSON</button><button class="action danger" id="reset">Wyzeruj stronę</button></div>
<input id="importFile" type="file" accept=".json,application/json" hidden><p class="muted">Dane zapisują się lokalnie w tej przeglądarce. Aby zabezpieczyć wyniki, pobierz kopię JSON. Nie czyść danych witryny przed eksportem.</p></main><div class="toast" id="toast" role="status"></div><script src="app.js"></script></body></html>
